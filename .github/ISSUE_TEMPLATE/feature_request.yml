name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please keep suggestions field-neutral. This project should be equally
        useful to a nurse, a graphic designer and a backend engineer, so
        anything that assumes one industry is unlikely to be merged.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve
      description: Describe the situation you hit, not just the feature you want.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - MCP server or tools
        - A workflow (/apply, /scrape, /rank, ...)
        - A job board / portal
        - CV or cover letter templates
        - Documentation
        - Other
    validations:
      required: true
